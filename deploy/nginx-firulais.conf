# /etc/nginx/sites-available/firulais — Ubuntu Server + NGINX + PHP-FPM (punto 15 del Trabajo Final)
# Activar: sudo ln -s /etc/nginx/sites-available/firulais /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name firulais.local 192.168.10.18;   # SRV-09, servidor web del plan de IP

    # Solo public/ queda expuesta: config/, core/, models/ y database/ no se pueden pedir desde el navegador.
    root /var/www/firulais/backend/public;
    index index.html;

    # API: front controller PHP
    location /api/ {
        try_files $uri /api/index.php$is_args$args;
    }

    location ~ ^/api/index\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # Conexión a MariaDB (SRV-08, servidor de base de datos). Cambiar la contraseña.
        fastcgi_param DB_HOST 192.168.10.17;
        fastcgi_param DB_PORT 3306;
        fastcgi_param DB_NAME firulais;
        fastcgi_param DB_USER firulais;
        fastcgi_param DB_PASS cambiar-esta-clave;
    }

    # Ningún otro .php se ejecuta
    location ~ \.php$ { return 404; }

    # Aplicación (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. { deny all; }
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy same-origin;
}
